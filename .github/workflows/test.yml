name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  drivers:
    # Each of Python/psycopg2, Node.js/node-postgres, Java/pgJDBC,
    # .NET/Npgsql, psqlODBC (via pyodbc), PHP/PDO_PGSQL, Ruby/pg, and
    # Rust/postgres connects to a freshly `go install`ed ExecDB's pgwire
    # with its own default settings (no ExecDB-specific workaround flags
    # -- Npgsql's connection string and ExecDB's own server-side
    # pg_catalog compatibility views are the two documented exceptions;
    # see README.md). Runs on ubuntu-latest only: this verifies the
    # pgwire protocol implementation itself (OS-independent), not
    # platform-specific behavior, so eight extra runtimes across
    # multiple OSes would not buy anything.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "stable"
          cache: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install psycopg2
        run: pip install psycopg2-binary

      - name: Install unixODBC + psqlODBC + pyodbc
        run: |
          sudo apt-get update
          sudo apt-get install -y unixodbc unixodbc-dev odbc-postgresql
          pip install pyodbc

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: shivammathur/setup-php@2.37.2
        with:
          php-version: "8.2"
          extensions: pdo_pgsql

      - uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: "3.1"
          bundler-cache: false

      - name: Install libpq-dev (needed to build the pg gem's native extension)
        run: sudo apt-get install -y libpq-dev

      - name: Install pg gem
        run: gem install pg --no-document

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: go install execdb
        run: go install github.com/amisonnet8/execdb/cmd/execdb@latest

      - name: run-all.sh
        run: ./run-all.sh
